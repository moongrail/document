spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    enabled: false

worker:
  batch-size: 50
  submit:
    cron: "-"
  approve:
    cron: "-"
  initiator: "TEST_WORKER"

logging:
  level:
    ru.itq.fun.document: WARN
